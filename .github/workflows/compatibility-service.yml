name: Compatibility report service
on:
  push:
    branches: [main]
    paths: ['services/compatibility/**', 'contracts/**', '.github/workflows/compatibility-service.yml']
  pull_request:
    paths: ['services/compatibility/**', 'contracts/**', '.github/workflows/compatibility-service.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/compatibility
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: /tmp/fanbar-wrangler-ci.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/compatibility/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint:css
      - run: npm test
      - run: npm run dry-run
