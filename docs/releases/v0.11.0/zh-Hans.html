<h3>新功能</h3>
<ul>
<li>更新检查现在经由 update.getfanbar.com，按应用版本和日期匿名统计检查次数。共享匿名使用统计默认关闭；开启后每周发送安装周、Mac 机型、macOS 主版本和芯片架构，Cloudflare 还会根据网络位置提供国家信息。可在设置中更改。<a href="https://github.com/helson-lin/FanBar/blob/main/services/update/PRIVACY.zh-CN.md">隐私详情</a>。</li>
<li>菜单栏可选择系统风扇图标，或隐藏图标、仅显示读数。</li>
<li>设置中新增邮件反馈入口。</li>
</ul>
<h3>修复</h3>
<ul>
<li>改进向 macOS 交还风扇控制，以及风扇减速时切换到手动控制的处理。</li>
<li>修复风扇曲线前面的控制点无法选择、数值标签换行及菜单栏读数重叠。</li>
</ul>
