<h3>新功能</h3>
<ul>
<li>選單列可選擇系統風扇圖示，或隱藏圖示、只顯示讀數。</li>
<li>設定中新增電子郵件回饋入口。</li>
<li>更新檢查現在經由 update.getfanbar.com，按應用程式版本和日期匿名統計檢查次數。分享匿名使用統計預設關閉；開啟後每週傳送安裝週、Mac 機型、macOS 主版本和晶片架構，Cloudflare 還會根據網路位置提供國家資訊。可在設定中變更。<a href="https://github.com/helson-lin/FanBar/blob/main/services/update/PRIVACY.zh-CN.md">隱私詳情</a>。</li>
</ul>
<h3>修正</h3>
<ul>
<li>改善向 macOS 交還風扇控制，以及風扇減速時切換至手動控制的處理。</li>
<li>修正風扇曲線前方控制點無法選取、數值標籤換行及選單列讀數重疊。</li>
</ul>
