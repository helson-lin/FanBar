<h3>修正</h3>
<ul>
<li>ヘルパーが受け入れた手動目標回転数をすべて記憶するようにし（従来のプリセットと同じ値を含む）、モードを切り替えて戻ったときに前回の目標値を復元します（書き込みに失敗した場合は以前保存した値を維持します）。</li>
<li>メニューパネルと制御返却通知での固定回転数モードの名称を「手動」に統一しました。</li>
<li>設定の各タブで見出しとコントロールの配置を揃え、メニューバー設定のシステムリソースプレビューを左寄せのコンパクトな表示にして 100% 表示分の幅を確保しました。</li>
<li>メニューパネルで展開中の起動ディスクと CPU の詳細を直接切り替えたときに空白になる問題を修正しました。</li>
</ul>
