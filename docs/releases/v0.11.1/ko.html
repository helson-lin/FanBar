<h3>수정 사항</h3>
<ul>
<li>제어 서비스가 수락한 모든 수동 목표 회전수(이전 프리셋과 같은 값 포함)를 기억하여 다른 모드로 전환했다가 돌아와도 마지막 목표값을 복원합니다(쓰기에 실패하면 이전에 저장된 값을 유지합니다).</li>
<li>메뉴 패널과 제어권 반환 알림에서 고정 속도 모드의 이름을 ‘수동’으로 통일했습니다.</li>
<li>설정 탭 전반의 그룹 제목과 컨트롤 정렬을 맞추고, 메뉴 막대 설정의 시스템 리소스 미리보기를 왼쪽 정렬의 간결한 형태로 조정해 100% 표시 공간을 확보했습니다.</li>
</ul>
